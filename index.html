<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrot Watch — Dein Pferd. Deine Ruhe.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF6F0;
    --warm-white: #FDF9F4;
    --dark: #1A1208;
    --brown: #3D2B1A;
    --orange: #C85A1E;
    --orange-light: #E8784A;
    --sage: #7A8C6E;
    --sand: #D4B896;
    --sand-light: #EDD9C0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--cream);
    color: var(--dark);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2rem 3rem;
    position: relative;
    z-index: 10;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    color: var(--brown);
    letter-spacing: 0.05em;
  }
  .logo span { color: var(--orange); }

  .nav-tag {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--sage);
    border: 1px solid var(--sand);
    padding: 0.4rem 1rem;
    border-radius: 100px;
  }

  /* Hier zwingen wir den Inhalt, IMMER sichtbar zu sein */
  .hero-content {
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    position: relative;
    z-index: 2;
    flex-grow: 1;
  }

  .eyebrow {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--orange);
    margin-bottom: 1.5rem;
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    line-height: 1.15;
    color: var(--dark);
    max-width: 20ch;
    margin-bottom: 1.5rem;
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
  }
  .headline em { font-style: italic; color: var(--orange); }

  .subline {
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    color: var(--brown);
    max-width: 46ch;
    line-height: 1.7;
    margin-bottom: 2rem;
    font-weight: 300;
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
  }

  .counter-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: white;
    border: 1.5px solid var(--sand-light);
    border-radius: 100px;
    padding: 0.5rem 1.1rem;
    font-size: 0.8rem;
    color: var(--brown);
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 20px rgba(180,120,60,0.08);
  }

  .counter-dot {
    width: 7px;
    height: 7px;
    background: var(--sage);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  .counter-num { font-weight: 500; color: var(--orange); }

  .perks {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 2rem;
  }

  .perk {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    color: var(--brown);
    opacity: 0.8;
  }

  .perk-icon { font-size: 0.9rem; }
  .perk-divider { width: 3px; height: 3px; background: var(--sand); border-radius: 50%; }

  .form-wrap {
    width: 100%;
    max-width: 480px;
    min-height: 120px;
    margin: 0 auto;
  }

  .form-note {
    font-size: 0.72rem;
    color: var(--sage);
    margin-top: 0.75rem;
    text-align: center;
    letter-spacing: 0.03em;
  }

  .scroll-hint {
    text-align: center;
    padding-bottom: 1.5rem;
  }

  .scroll-hint span {
    display: block;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--sand);
    margin-bottom: 0.5rem;
  }

  .scroll-arrow {
    width: 1px;
    height: 30px;
    background: linear-gradient(to bottom, var(--sand), transparent);
    margin: 0 auto;
  }

  .deco-circle { position: absolute; border-radius: 50%; pointer-events: none; }
  .deco-1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(200,90,30,0.06) 0%, transparent 70%); top: -100px; right: -200px; animation: float 8s ease-in-out infinite; }
  .deco-2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(122,140,110,0.08) 0%, transparent 70%); bottom: 0; left: -100px; animation: float 10s ease-in-out infinite reverse; }

  /* WHY SECTION */
  .why-section { background: var(--warm-white); padding: 6rem 2rem; position: relative; }
  .why-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(to right, transparent, var(--sand-light), transparent); }
  .section-inner { max-width: 900px; margin: 0 auto; }
  .section-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.25em; color: var(--orange); margin-bottom: 3rem; display: flex; align-items: center; gap: 1rem; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--sand-light); max-width: 60px; }
  .why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .why-item { padding: 2.5rem; border-bottom: 1px solid var(--sand-light); border-right: 1px solid var(--sand-light); }
  .why-item:nth-child(even) { border-right: none; }
  .why-item:nth-last-child(-n+2) { border-bottom: none; }
  .why-title { font-size: 1rem; font-weight: 500; color: var(--brown); margin-bottom: 0.75rem; }
  .why-num { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--sand-light); line-height: 1; margin-bottom: 1rem; }
  .why-text { font-size: 0.88rem; color: var(--brown); opacity: 0.65; line-height: 1.7; }

  /* MEASURES */
  .measures-section { padding: 6rem 2rem; background: var(--dark); color: var(--cream); position: relative; }
  .measures-section .section-label { color: var(--orange-light); }
  .measures-section .section-label::after { background: rgba(255,255,255,0.1); }
  .measures-headline { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 3rem); line-height: 1.2; max-width: 22ch; margin-bottom: 3rem; color: var(--cream); }
  .measures-headline em { font-style: italic; color: var(--orange-light); }
  .measures-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; list-style: none; }
  .measure-item { display: flex; align-items: flex-start; gap: 1rem; padding: 1.5rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; }
  .measure-icon { font-size: 1.4rem; flex-shrink: 0; }
  .measure-text strong { display: block; font-size: 0.85rem; font-weight: 500; color: var(--cream); margin-bottom: 0.3rem; }
  .measure-text span { font-size: 0.78rem; color: rgba(255,255,255,0.4); line-height: 1.5; }

  /* FOUNDER */
  .founder-section { padding: 6rem 2rem; background: var(--cream); position: relative; }
  .founder-inner { max-width: 700px; margin: 0 auto; }
  .founder-quote { font-family: 'Playfair Display', serif; font-size: clamp(1.3rem, 3vw, 1.9rem); line-height: 1.5; color: var(--brown); margin-bottom: 2.5rem; font-style: italic; position: relative; padding-left: 2rem; }
  .founder-quote::before { content: '"'; position: absolute; left: 0; top: -0.5rem; font-size: 4rem; color: var(--sand-light); font-family: 'Playfair Display', serif; line-height: 1; }
  .founder-credit { display: flex; align-items: center; gap: 1rem; padding-left: 2rem; }
  .founder-dot { width: 36px; height: 36px; background: var(--orange); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
  .founder-name { font-size: 0.85rem; font-weight: 500; color: var(--dark); }
  .founder-title { font-size: 0.75rem; color: var(--sage); margin-top: 0.2rem; }

  /* CTA BOTTOM */
  .cta-section { padding: 6rem 2rem; background: var(--sand-light); text-align: center; position: relative; }
  .cta-headline { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.8rem); color: var(--dark); margin-bottom: 1rem; line-height: 1.2; }
  .cta-sub { font-size: 0.95rem; color: var(--brown); opacity: 0.7; margin-bottom: 1.5rem; max-width: 42ch; margin-left: auto; margin-right: auto; }
  .cta-perks { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; margin-bottom: 2.5rem; }
  .cta-perk { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--brown); }
  .cta-form { max-width: 460px; margin: 0 auto; min-height: 120px; }

  footer { padding: 2rem 3rem; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--sand-light); background: var(--cream); }
  .footer-logo { font-family: 'Playfair Display', serif; font-size: 0.9rem; color: var(--brown); }
  .footer-logo span { color: var(--orange); }
  .footer-note { font-size: 0.7rem; color: var(--sage); }

  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }

  @media (max-width: 640px) {
    nav { padding: 1.5rem; }
    .why-grid { grid-template-columns: 1fr; }
    .why-item { border-right: none; border-bottom: 1px solid var(--sand-light); }
    .why-item:last-child { border-bottom: none; }
    footer
