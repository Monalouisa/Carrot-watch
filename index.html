<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrot Watch — Dein Pferd. Deine Ruhe.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script async type="text/javascript" src="https://static.klaviyo.com/onsite/js/klaviyo.js?company_id=W8ya8S"></script>
<style>
  :root {
    --cream: #FAF6F0;
    --warm-white: #FDF9F4;
    --dark: #1A1208;
    --brown: #3D2B1A;
    --orange: #C85A1E;
    --orange-light: #E8784A;
    --sage: #7A8C6E;
    --sand: #D4B896;
    --sand-light: #EDD9C0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--cream);
    color: var(--dark);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .hero {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    position: relative;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2rem 3rem;
    position: relative;
    z-index: 10;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    color: var(--brown);
    letter-spacing: 0.05em;
  }
  .logo span { color: var(--orange); }

  .nav-tag {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--sage);
    border: 1px solid var(--sand);
    padding: 0.4rem 1rem;
    border-radius: 100px;
  }

  .hero-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 2rem;
    position: relative;
    z-index: 2;
  }

  .eyebrow {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--orange);
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.2s;
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    line-height: 1.1;
    color: var(--dark);
    max-width: 18ch;
    margin-bottom: 1.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.4s;
    display: none;
  }
  .headline em { font-style: italic; color: var(--orange); }

  .subline {
    font-size: clamp(1rem, 2vw, 1.15rem);
    color: var(--brown);
    opacity: 0;
    max-width: 44ch;
    line-height: 1.75;
    margin-bottom: 2rem;
    font-weight: 300;
    animation: fadeUp 0.8s ease forwards 0.6s;
    display: none;
  }

  /* COUNTER BADGE */
  .counter-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: white;
    border: 1.5px solid var(--sand-light);
    border-radius: 100px;
    padding: 0.5rem 1.1rem;
    font-size: 0.8rem;
    color: var(--brown);
    margin-bottom: 2rem;
    box-shadow: 0 2px 20px rgba(180,120,60,0.08);
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.7s;
  }

  .counter-dot {
    width: 7px;
    height: 7px;
    background: var(--sage);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  .counter-num {
    font-weight: 500;
    color: var(--orange);
  }

  /* PERKS */
  .perks {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.75s;
  }

  .perk {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    color: var(--brown);
    opacity: 0.8;
  }

  .perk-icon {
    font-size: 0.9rem;
  }

  .perk-divider {
    width: 3px;
    height: 3px;
    background: var(--sand);
    border-radius: 50%;
  }

  /* FORM */
  .form-wrap {
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.85s;
    width: 100%;
    max-width: 480px;
  }

  .form-note {
    font-size: 0.72rem;
    color: var(--sage);
    margin-top: 0.75rem;
    text-align: center;
    letter-spacing: 0.03em;
  }

  .scroll-hint {
    text-align: center;
    padding: 2rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1.1s;
  }

  .scroll-hint span {
    display: block;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--sand);
    margin-bottom: 0.5rem;
  }

  .scroll-arrow {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, var(--sand), transparent);
    margin: 0 auto;
  }

  .deco-circle { position: absolute; border-radius: 50%; pointer-events: none; }

  .deco-1 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(200,90,30,0.06) 0%, transparent 70%);
    top: -100px; right: -200px;
    animation: float 8s ease-in-out infinite;
  }

  .deco-2 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(122,140,110,0.08) 0%, transparent 70%);
    bottom: 0; left: -100px;
    animation: float 10s ease-in-out infinite reverse;
  }

  /* WHY SECTION */
  .why-section {
    background: var(--warm-white);
    padding: 6rem 2rem;
    position: relative;
  }

  .why-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--sand-light), transparent);
  }

  .section-inner { max-width: 900px; margin: 0 auto; }

  .section-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--orange);
    margin-bottom: 3rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--sand-light);
    max-width: 60px;
  }

  .why-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }

  .why-item {
    padding: 2.5rem;
    border-bottom: 1px solid var(--sand-light);
    border-right: 1px solid var(--sand-light);
    transition: background 0.3s ease;
  }

  .why-item:nth-child(even) { border-right: none; }
  .why-item:nth-last-child(-n+2) { border-bottom: none; }
  .why-item:hover { background: rgba(200,90,30,0.03); }

  .why-num {
    font-family: 'Playfair Display', serif;
    font-size: 2.5rem;
    color: var(--sand-light);
    line-height: 1;
    margin-bottom: 1rem;
  }

  .why-title {
    font-size: 1rem;
    font-weight: 500;
    color: var(--brown);
    margin-bottom: 0.75rem;
  }
